[colors]
draw_bold_text_with_bright_colors = false

[colors.bright]
black = "0x72696a"
blue = "0x7fa2ac"
cyan = "0x85dacc"
green = "0x48efa4"
magenta = "0xa8a9eb"
red = "0xfd6883"
white = "0xfff1f3"
yellow = "0xf9cc6c"

[colors.normal]
black = "0x2c2525"
blue = "0x7fa2ac"
cyan = "0x85dacc"
green = "0x48efa4"
magenta = "0xa8a9eb"
red = "0xfd6883"
white = "0xfff1f3"
yellow = "0xf9cc6c"

[colors.primary]
background = "#0C1211"
foreground = "#ebdbb2"

[cursor]
blink_interval = 500

[cursor.style]
blinking = "Always"
shape = "Block"

[font]
size = 11

[font.bold]
family = "Fira Code Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Fira Code Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Fira Code Nerd Font"
style = "Italic"

[font.normal]
family = "Fira Code Nerd Font"
style = "Regular"

[font.offset]
y = 3

# [[keyboard.bindings]]
# action = "ToggleViMode"
# key = "Escape"
# mode = "~Search"
# mods = "Shift|Control"

[[keyboard.bindings]]
key = "Delete"
chars = "\u001b[3~"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[terminal]

[terminal.shell]
program = "/usr/bin/zsh"

[window]
dynamic_padding = true
opacity = 0.97

[window.dimensions]
columns = 150
lines = 45

[window.padding]
x = 5
y = 9

[keyboard]
