# Dotfiles Configuration

[[configs]]
description = "Alacritty terminal emulator config"
enabled = false
name = "alacritty"
source = "$DOTFILES_DIR/alacritty"
target = "$HOME/.config/alacritty"

[[configs]]
description = "Neovim configuration"
enabled = true
name = "nvim"
source = "$DOTFILES_DIR/nvim"
target = "$HOME/.config/nvim"

[[configs]]
description = "Zsh main configuration"
enabled = true
name = "zshrc"
source = "$DOTFILES_DIR/zsh/zshrc"
target = "$HOME/.zshrc"

[[configs]]
description = "Zsh aliases and functions"
enabled = true
name = "zsh_aliases"
source = "$DOTFILES_DIR/zsh/zsh_aliases"
target = "$HOME/.zsh_aliases"

[[configs]]
description = "KDE Plasma look-and-feel theme (Nbry)"
enabled = false
name = "kde-theme"
source = "$DOTFILES_DIR/kde/org.github.nbry.Nbry"
target = "$HOME/.local/share/plasma/look-and-feel/org.github.nbry.Nbry"

